<script>
  function showError(title, detail) {
    var el = document.getElementById('error-overlay');
    el.style.display = 'block';
    el.innerHTML = '<h2>' + title + '</h2>' + (detail || '');
  }
  window.addEventListener('error', function (e) {
    showError('Script error', (e.message || 'Unknown error') + '\n\nFile: ' + (e.filename || '') + '\nLine: ' + (e.lineno || ''));
  });
  window.addEventListener('unhandledrejection', function (e) {
    showError('Unhandled promise rejection', String(e.reason));
  });
  window.addEventListener('load', function () {
    setTimeout(function () {
      if (typeof React === 'undefined') showError('React failed to load', 'The CDN script for React did not load. Check your internet connection or try a different network/browser.');
      else if (typeof ReactDOM === 'undefined') showError('ReactDOM failed to load', 'The CDN script for ReactDOM did not load.');
      else if (typeof Babel === 'undefined') showError('Babel failed to load', 'The CDN script for Babel standalone did not load.');

  });
</script>

function hashCode(str) {
  let h = 0;
  for (let i = 0; i < str.length; i++) {
    h = (h << 5) - h + str.charCodeAt(i);
    h |= 0;
  }
  return Math.abs(h);
}

function seededRandom(seed) {
  let s = seed % 2147483647;
  if (s <= 0) s += 2147483646;
  return () => {
    s = (s * 16807) % 2147483647;
    return (s - 1) / 2147483646;
  };
}

function pickRelicForToken(tokenId) {
  const rand = seededRandom(hashCode("relic-" + tokenId))();
  const total = RARITY_WEIGHTS.reduce((a, [, w]) => a + w, 0);
  let acc = 0;
  let rarity = "COMMON";
  for (const [r, w] of RARITY_WEIGHTS) {
    acc += w;
    if (rand * total <= acc) {
      rarity = r;
      break;
    }
  }
  const options = RELIC_TYPES.filter((r) => r.rarity === rarity);
  const idx = Math.floor(seededRandom(hashCode("pick-" + tokenId))() * options.length);
  return options[idx] || options[0];
}

function buildCollection(count) {
  const items = [];
  for (let i = 1; i <= count; i++) {
    const tokenId = i;
    const relic = pickRelicForToken(tokenId);
    const level = 1 + Math.floor(seededRandom(hashCode("level-" + tokenId))() * 8);
    items.push({
      tokenId,
      label: "#" + String(tokenId).padStart(4, "0"),
      relic,
      level,
    });
  }
  return items;
}

/* ============================================================
   PIXEL ART GENERATOR
   ============================================================ */
function generatePattern(seedStr) {
  const rnd = seededRandom(hashCode(seedStr));
  const cols = 5;
  const rows = 10;
  const half = [];
  for (let r = 0; r < rows; r++) {
    const row = [];
    for (let c = 0; c < cols; c++) {
      const edgeBias = c === cols - 1 ? 0.55 : c === cols - 2 ? 0.3 : 0.12;
      const v = rnd();
      let cell = 0;
      if (v > 0.42 + edgeBias * 0.3) {
        if (v > 0.86) cell = 3;
        else if (v > 0.66) cell = 2;
        else cell = 1;
      }
      row.push(cell);
    }
    half.push(row);
  }
  const full = half.map((row) => [...row, ...[...row].reverse()]);
  return full;
}

function PixelArt({ seed, palette, size = 96, rounded = true }) {
  const pattern = useMemo(() => generatePattern(seed), [seed]);
  const cell = size / 10;
  return (
    <svg
      width={size}
      height={size}
      viewBox="0 0 10 10"
      style={{ display: "block", imageRendering: "pixelated" }}
      shapeRendering="crispEdges"
    >
      {rounded && (
        <rect x="0" y="0" width="10" height="10" fill={palette[1]} opacity="0.06" />
      )}
      {pattern.map((row, r) =>
        row.map((v, c) =>
          v === 0 ? null : (
            <rect key={r + "-" + c} x={c} y={r} width="1" height="1" fill={palette[v]} />
          )
        )
      )}
    </svg>
  );
}

/* ============================================================
   COLLECTION PAGE
   ============================================================ */
function CollectionPage({ goDetail }) {
  const [search, setSearch] = useState("");
  const [rarityFilter, setRarityFilter] = useState("All");
  const [levelFilter, setLevelFilter] = useState(null);
  const [sort, setSort] = useState("id-asc");
  const [showFilters, setShowFilters] = useState(false);

  const rarities = ["All", "Common", "Uncommon", "Rare", "Epic", "Legendary", "Mythic", "Eternal", "Divine"];

  const filtered = useMemo(() => {
    let list = [...COLLECTION];
    if (search.trim()) {
      const q = search.trim().toLowerCase();
      list = list.filter(
        (i) => i.relic.name.toLowerCase().includes(q) || i.label.toLowerCase().includes(q)
      );
    }
    if (rarityFilter !== "All") {
      list = list.filter((i) => i.relic.rarity.toLowerCase() === rarityFilter.toLowerCase());
    }
    if (levelFilter) {
      list = list.filter((i) => i.level === levelFilter);
    }
    if (sort === "id-asc") list.sort((a, b) => a.tokenId - b.tokenId);
    if (sort === "id-desc") list.sort((a, b) => b.tokenId - a.tokenId);
    if (sort === "rarity") {
      const order = ["DIVINE", "ETERNAL", "MYTHIC", "LEGENDARY", "EPIC", "RARE", "UNCOMMON", "COMMON"];
      list.sort((a, b) => order.indexOf(a.relic.rarity) - order.indexOf(b.relic.rarity));
    }
    return list;
  }, [search, rarityFilter, levelFilter, sort]);

  return (
    <div className="max-w-[1240px] mx-auto px-6 md:px-10 pt-40 pb-24">
      <div className="flex items-end justify-between flex-wrap gap-4 mb-10">
        <div>
          <h1 className="text-[34px]" style={{ fontFamily: "var(--font-serif)", color: COLORS.text }}>
            Relics
          </h1>
          <p className="text-[13px] mt-2" style={{ color: COLORS.textMuted, fontFamily: "var(--font-mono)" }}>
            {TOTAL_SUPPLY.toLocaleString()} RELICS
          </p>
        </div>

        <div className="flex items-center gap-3">
          <div className="flex items-center gap-2 border px-3 py-2" style={{ borderColor: COLORS.border }}>
            <Search size={14} color={COLORS.textMuted} />
            <input
              value={search}
              onChange={(e) => setSearch(e.target.value)}
              placeholder="Search"
              className="bg-transparent outline-none text-[13px] w-[130px]"
              style={{ color: COLORS.text, fontFamily: "var(--font-sans)" }}
            />
          </div>
          <button
            onClick={() => setShowFilters(!showFilters)}
            className="flex items-center gap-2 border px-3 py-2 text-[12px] tracking-[0.08em]"
            style={{ borderColor: COLORS.border, color: COLORS.text, fontFamily: "var(--font-sans)" }}
          >
            <SlidersHorizontal size={14} /> FILTER
          </button>
          <div className="relative flex items-center gap-2 border px-3 py-2" style={{ borderColor: COLORS.border }}>
            <select
              value={sort}
              onChange={(e) => setSort(e.target.value)}
              className="bg-transparent outline-none text-[12px] tracking-[0.08em] appearance-none pr-4"
              style={{ color: COLORS.text, fontFamily: "var(--font-sans)" }}
            >
              <option style={{ background: COLORS.bg2 }} value="id-asc">ID ↑</option>
              <option style={{ background: COLORS.bg2 }} value="id-desc">ID ↓</option>
              <option style={{ background: COLORS.bg2 }} value="rarity">RARITY</option>
            </select>
            <ChevronDown size={13} color={COLORS.textMuted} className="absolute right-2 pointer-events-none" />
          </div>
        </div>
      </div>

      {showFilters && (
        <div className="mb-10 border p-6" style={{ borderColor: COLORS.border, background: COLORS.bg2 }}>
          <div className="mb-5">
            <div className="text-[10px] tracking-[0.16em] mb-3" style={{ color: COLORS.textMuted, fontFamily: "var(--font-mono)" }}>
              RARITY
            </div>
            <div className="flex flex-wrap gap-2">
              {rarities.map((r) => (
                <button
                  key={r}
                  onClick={() => setRarityFilter(r)}
                  className="px-3 py-1.5 text-[11px] tracking-[0.06em] border"
                  style={{
                    borderColor: rarityFilter === r ? COLORS.gold : COLORS.border,
                    color: rarityFilter === r ? COLORS.gold : COLORS.textMuted,
                    fontFamily: "var(--font-sans)",
                  }}
                >
                  {r}
                </button>
              ))}
            </div>
          </div>
          <div>
            <div className="text-[10px] tracking-[0.16em] mb-3" style={{ color: COLORS.textMuted, fontFamily: "var(--font-mono)" }}>
              LEVEL
            </div>
            <div className="flex flex-wrap gap-2">
              {LEVELS.map((l) => (
                <button
                  key={l.level}
                  onClick={() => setLevelFilter(levelFilter === l.level ? null : l.level)}
                  className="px-3 py-1.5 text-[11px] tracking-[0.06em] border flex items-center gap-2"
                  style={{
                    borderColor: levelFilter === l.level ? COLORS.gold : COLORS.border,
                    color: levelFilter === l.level ? COLORS.gold : COLORS.textMuted,
                    fontFamily: "var(--font-sans)",
                  }}
                >
                  <span className="w-2 h-2 rounded-full" style={{ background: l.color }} />
                  LEVEL {l.level}
                </button>
              ))}
            </div>
          </div>
        </div>
      )}

      <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-4">
        {filtered.map((item) => (
          <NFTCard key={item.tokenId} item={item} onClick={() => goDetail(item.tokenId)} />
        ))}
      </div>

      {filtered.length === 0 && (
        <div className="py-20 text-center text-[13px]" style={{ color: COLORS.textMuted, fontFamily: "var(--font-sans)" }}>
          No relics match these filters.
        </div>
      )}

      <div className="mt-10 text-[11px]" style={{ color: COLORS.textMuted, fontFamily: "var(--font-mono)" }}>
        Showing {filtered.length} of {COLLECTION_PREVIEW_COUNT} previewed · {TOTAL_SUPPLY.toLocaleString()} total supply
      </div>
    </div>
  );
}

function RelicsApp() {
  const [page, setPage] = useState("mint");

  useEffect(() => {
    window.scrollTo(0, 0);
  }, [page]);

  const goDetail = (tokenId) => {
    setSelectedToken(tokenId);
    setPage("detail");
  };

  return (
    <div style={{ background: COLORS.bg, minHeight: "100vh" }}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');
        :root {
          --font-serif: 'Fraunces', serif;
          --font-sans: 'Inter', sans-serif;
          --font-mono: 'JetBrains Mono', monospace;
        }
        * { box-sizing: border-box; }
        body { background: ${COLORS.bg}; }
        select option { background: ${COLORS.bg2}; }
        ::-webkit-scrollbar { height: 6px; width: 6px; }
        ::-webkit-scrollbar-thumb { background: ${COLORS.border}; }
      `}</style>

      <Header page={page} setPage={setPage} mobileOpen={mobileOpen} setMobileOpen={setMobileOpen} />

      {page === "mint" && <MintPage goDetail={goDetail} />}
      {page === "collection" && <CollectionPage goDetail={goDetail} />}
      {page === "detail" && <DetailPage tokenId={selectedToken} goCollection={() => setPage("collection")} />}
      {page === "stake" && <StakePage />}
      {page === "earn" && <EarnPage />}
      {page === "docs" && <DocsPage />}

      <Footer setPage={setPage} />
    </div>
  );
}
